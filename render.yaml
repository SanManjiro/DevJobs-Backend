services:
  - type: web
    name: devjobs-backend
    runtime: docker
    repo: https://github.com/SanManjiro/DevJobs-Backend
    plan: free
    region: oregon
    branch: master
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: 10000
      - key: APP_NAME
        value: DevJobs
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: devjobs-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: devjobs-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: devjobs-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: devjobs-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: devjobs-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      # Frontend origin OAuth redirects the browser back to after issuing
      # its one-time code. Fill in once the frontend is deployed.
      - key: FRONTEND_URL
        sync: false
      # GitHub/Google OAuth apps: register them with these callback URLs,
      # then paste the client id/secret here.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: https://devjobs-backend-6gq1.onrender.com/api/v1/auth/github/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://devjobs-backend-6gq1.onrender.com/api/v1/auth/google/callback
      # Fill these in, then run `php artisan db:seed --class=AdminSeeder`
      # via the Render shell to create the production admin account.
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: devjobs-db
    databaseName: devjobs
    user: devjobs
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
