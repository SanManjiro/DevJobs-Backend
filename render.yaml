services:
  - type: web
    name: devjobs-backend
    runtime: docker
    repo: https://github.com/SanManjiro/DevJobs-Backend
    plan: free
    region: oregon
    branch: master
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: 10000
      - key: APP_NAME
        value: DevJobs
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: devjobs-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: devjobs-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: devjobs-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: devjobs-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: devjobs-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: devjobs-db
    databaseName: devjobs
    user: devjobs
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
